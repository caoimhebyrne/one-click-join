name: Build

on:
  - pull_request
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build
        uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: ./**/build/libs/
